.chead .ava{width:40px;height:40px}

.m.me{align-self:flex-end;background:var(--acc2);color:#fff;border-bottom-right-radius:6px}
.m:not(.me){border-bottom-left-radius:6px}
.m.fire{background:var(--acc);color:#1F2A5A;font-weight:900}
.cin{display:flex;gap:8px;padding:8px 12px;flex:none;align-items:flex-end}
.cin input{flex:1;min-width:0;height:44px;border-radius:22px;border:2px solid var(--line);background:var(--card);padding:0 16px;font:inherit;font-weight:600;color:var(--ink)}
.cin .ib{border-radius:50%;width:44px;height:44px}
.splash{align-items:center;justify-content:space-between;padding:70px 0 60px;background:linear-gradient(var(--acc2),#3B2FA8);color:#fff;text-align:center}
.splash h2{font-size:38px;font-weight:900;margin-top:10px}
.splash p{font-weight:700;opacity:.9;padding:0 40px}
.mid{display:flex;flex-direction:column;align-items:center}
.scrim{position:absolute;inset:0;background:rgba(10,12,40,.5);display:none;align-items:flex-end;z-index:5}

.sheet{background:var(--card);width:100%;border-radius:26px 26px 0 0;padding:18px 16px 24px;max-height:80%;overflow-y:auto}

.sheet label{display:block;font-weight:800;font-size:13px;color:var(--mute);margin:14px 0 6px}
.sheet input{width:100%;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:0 12px;font:inherit;font-weight:700;color:var(--ink)}
.tm{display:flex;gap:10px;align-items:center}
.cta{margin-top:18px;width:100%;height:48px;border-radius:16px;background:var(--acc);color:#1F2A5A;font-weight:900;font-size:16px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:9;white-space:nowrap}
.toast.on{opacity:1}
.jump{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px;padding:0 10px}
.jump button{font-size:12px;font-weight:800;padding:5px 10px;border-radius:10px;background:var(--card);color:var(--ink)}
@media (max-width:420px){body{justify-content:flex-start}.phone{width:100%;max-height:none;height:100%;border-radius:0;border:0}}

.today .tp,.today .tl{background:var(--card2);border:0;backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink)}
.today .tl{background:var(--acc);color:#1D1D1F;font-weight:600}
.prof .cta{min-height:46px;height:46px;padding:0 22px;width:auto;flex:none}
.lv,.lv.y,.lv.v,.lv.g,.lv.d{background:var(--card);color:var(--ink);border:0;box-shadow:none;font-weight:600}
.ib svg,.nav svg{stroke-width:1.7}
.x svg{stroke-width:1.9}.chip svg{stroke-width:1.8}
.status,.gbar{display:none!important}
.phone,.phone[data-t=light]{border:0!important;border-radius:0!important;box-shadow:none!important}
@keyframes qIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.screen.anim .body>*{animation:qIn .3s ease-out both}
@media (prefers-reduced-motion:reduce){.screen.anim .body>*{animation:none}}
</style></head>

<script>

setTimeout(function(){var sp=document.getElementById('s-splash');if(!sp||!sp.classList.contains('on'))return;
 try{go((CLOUD&&!ME&&!localStorage.getItem('zp_tok'))?'auth':'home');}catch(e){try{go('home')}catch(x){}}
 if(sp.classList.contains('on')){sp.classList.remove('on');var h=document.getElementById('s-home');if(h)h.classList.add('on');}},4500);
</script>

function startDrag(item,y0){
 const type=item.classList.contains('blk')?'b':item.classList.contains('day')?'d':'g',sel=type=='b'?'.blk':type=='d'?'.day':'.group';
 const sibs=[...item.parentElement.children].filter(c=>c.matches(sel)),from=sibs.indexOf(item);
 if(sibs.length<2)return;
 const body=item.closest('.body');if(!body)return;
 const rects=sibs.map(c=>c.getBoundingClientRect()),cs=getComputedStyle(item);
 const gap=Math.max(parseFloat(cs.marginTop)||0,parseFloat(cs.marginBottom)||0);
 DG={item,sibs,from,to:from,y0,s0:body.scrollTop,body,h:rects[from].height+gap,mid:rects.map(r=>r.top+r.height/2+body.scrollTop),type,lastY:y0,raf:0};
 item.classList.add('dragging');sibs.forEach(c=>{if(c!==item)c.classList.add('dshift')});body.classList.add('dg');
 try{navigator.vibrate&&navigator.vibrate(18)}catch(e){}
 document.addEventListener('pointermove',dgMove);document.addEventListener('pointerup',dgEnd);document.addEventListener('pointercancel',dgEnd);
 dgTick();dgUpdate();}
function dgUpdate(){if(!DG)return;const d=DG,dy=d.lastY-d.y0+(d.body.scrollTop-d.s0);
 d.item.style.transform=`translateY(${dy}px) scale(1.02)`;
 const c=d.mid[d.from]+dy;let to=0;d.sibs.forEach((_,i)=>{if(i!==d.from&&d.mid[i]<c)to++});d.to=to;
 d.sibs.forEach((el,i)=>{if(i===d.from)return;el.style.transform=(d.from<to&&i>d.from&&i<=to)?`translateY(${-d.h}px)`:(to<d.from&&i>=to&&i<d.from)?`translateY(${d.h}px)`:'';});}
function dgMove(e){if(!DG)return;DG.lastY=e.clientY;dgUpdate();}
function dgTick(){if(!DG)return;const r=DG.body.getBoundingClientRect(),y=DG.lastY;let v=0;
 if(y<r.top+70)v=-Math.ceil((r.top+70-y)/6);else if(y>r.bottom-70)v=Math.ceil((y-(r.bottom-70))/6);
 if(v){DG.body.scrollTop+=v;dgUpdate();}DG.raf=requestAnimationFrame(dgTick);}
function dgEnd(){if(!DG)return;const d=DG;DG=null;cancelAnimationFrame(d.raf);
 document.removeEventListener('pointermove',dgMove);document.removeEventListener('pointerup',dgEnd);document.removeEventListener('pointercancel',dgEnd);
 d.body.classList.remove('dg');d.item.classList.remove('dragging');d.item.style.transform='';d.sibs.forEach(c=>{c.classList.remove('dshift');c.style.transform=''});
 noClick=Date.now()+250;
 if(d.to===d.from)return;
 let ref,arr;
 if(d.type=='g'){ref=d.item.querySelector('[data-delgrp]').dataset.delgrp.split('.');arr=S[ref[0]];}
 else if(d.type=='d'){ref=d.item.querySelector('[data-delday]').dataset.delday.split('.');arr=S[ref[0]][ref[1]].days;}
 else{ref=d.item.querySelector('[data-delblk]').dataset.delblk.split('.');arr=S[ref[0]][ref[1]].days[ref[2]].a;}
 arr.splice(d.to,0,arr.splice(d.from,1)[0]);
 if(d.type=='g'){if(ref[0]=='shared')S.gord=S.shared.map(x=>x.id);}else persist(ref[0],ref[1]);
 render();}

name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test:
        description: "Тестовая сборка (разрешён http, отдельное приложение)"
        type: boolean
        default: false
      api_url:
        description: "Адрес api.php для тестовой сборки (можно http://)"
        type: string
        default: ""
permissions:
  contents: write
env:
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android project
        env:
          TESTBUILD: ${{ inputs.test }}
          API_URL_IN: ${{ inputs.api_url }}
        run: |
          SRC=index.html
          [ -f "$SRC" ] || SRC=$(ls *.html 2>/dev/null | head -1)
          [ -n "$SRC" ] && [ -f "$SRC" ] || SRC=$(ls index* 2>/dev/null | head -1)
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "::error::В корне репозитория нет файла index.html. Загрузите его (Add file, Upload files) и запустите сборку снова."
            ls -la
            exit 1
          fi
          echo "Приложение: $SRC"
          mkdir -p www && cp "$SRC" www/index.html
          if [ "$TESTBUILD" = "true" ]; then
            echo "ТЕСТОВАЯ СБОРКА: разрешён http, приложение ставится отдельно"
            python3 - <<'PY'
          import os,re,json
          u=os.environ.get('API_URL_IN','').strip()
          if u:
              p='www/index.html';s=open(p,encoding='utf-8').read()
              s=re.sub(r'const API_URL="[^"]*";',lambda m:'const API_URL='+json.dumps(u)+';',s,count=1)
              open(p,'w',encoding='utf-8').write(s)
              print('API_URL ->',u)
          PY
          fi
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "week2day" com.zapomni.app --web-dir www
          if [ "$TESTBUILD" = "true" ]; then
            rm -f capacitor.config.ts capacitor.config.js capacitor.config.json
            cat > capacitor.config.json <<'EOF'
          {"appId":"com.zapomni.app","appName":"week2day","webDir":"www","server":{"cleartext":true},"android":{"allowMixedContent":true}}
          EOF
          fi
          npx cap add android
          if [ "$TESTBUILD" = "true" ]; then
            sed -i 's/applicationId "com.zapomni.app"/applicationId "com.zapomni.app.test"/' android/app/build.gradle
            sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">week2day (тест)</string>#; s#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">week2day (тест)</string>#' android/app/src/main/res/values/strings.xml
          fi
          cat > android/app/src/main/java/com/zapomni/app/MainActivity.java <<'EOF'
          package com.zapomni.app;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              registerPlugin(ZapomniPlugin.class);
              super.onCreate(b);
              if (Build.VERSION.SDK_INT >= 33) requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
            }
          }
          EOF
          cat > android/app/src/main/java/com/zapomni/app/AdminReceiver.java <<'EOF'
          package com.zapomni.app;
          import android.app.admin.DeviceAdminReceiver;
          public class AdminReceiver extends DeviceAdminReceiver {}
          EOF
          cat > android/app/src/main/java/com/zapomni/app/ZapomniPlugin.java <<'EOF'
          package com.zapomni.app;
          import android.app.AlarmManager;
          import android.appwidget.AppWidgetManager;
          import android.app.NotificationManager;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "Zapomni")
          public class ZapomniPlugin extends Plugin {
            @PluginMethod
            public void schedule(PluginCall call) {
              Scheduler.save(getContext(), call.getString("items", "[]"), Boolean.TRUE.equals(call.getBoolean("notify", true)));
              Scheduler.scheduleAll(getContext());
            getContext().getSharedPreferences(Scheduler.P, 0).edit().putString("wg", call.getString("wg", "[]")).apply(); ZapomniWidget.updateAll(getContext());
              call.resolve();
            }
            @PluginMethod
            public void status(PluginCall call) {
              Context c = getContext();
              JSObject r = new JSObject();
              NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
              DevicePolicyManager dp = (DevicePolicyManager) c.getSystemService(Context.DEVICE_POLICY_SERVICE);
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              r.put("dnd", nm.isNotificationPolicyAccessGranted());
              r.put("admin", dp.isAdminActive(new ComponentName(c, AdminReceiver.class)));
              r.put("overlay", Settings.canDrawOverlays(c));
              r.put("battery", ((android.os.PowerManager) c.getSystemService(Context.POWER_SERVICE)).isIgnoringBatteryOptimizations(c.getPackageName()));
              r.put("alarm", Build.VERSION.SDK_INT < 31 || am.canScheduleExactAlarms());
              call.resolve(r);
            }
            @PluginMethod
            public void saveImage(PluginCall call) {
              try {
                byte[] b = android.util.Base64.decode(call.getString("data"), android.util.Base64.DEFAULT);
                android.content.ContentValues v = new android.content.ContentValues();
                v.put(android.provider.MediaStore.Images.Media.DISPLAY_NAME, call.getString("name", "zapomni.png"));
                v.put(android.provider.MediaStore.Images.Media.MIME_TYPE, "image/png");
                if (Build.VERSION.SDK_INT >= 29) v.put(android.provider.MediaStore.Images.Media.RELATIVE_PATH, "Pictures/Zapomni");
                Uri u = getContext().getContentResolver().insert(android.provider.MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
                if (u == null) { call.reject("Не удалось создать файл в галерее"); return; }
                java.io.OutputStream o = getContext().getContentResolver().openOutputStream(u);
                o.write(b);
                o.close();
                call.resolve();
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }
            @PluginMethod
            public void pinWidget(PluginCall call) {
              Context c = getContext();
              AppWidgetManager m = AppWidgetManager.getInstance(c);
              JSObject r = new JSObject();
              boolean ok = Build.VERSION.SDK_INT >= 26 && m.isRequestPinAppWidgetSupported();
              if (ok) { c.getSharedPreferences(Scheduler.P, 0).edit().putString("pending", call.getString("gid", "")).putLong("pending_t", System.currentTimeMillis()).apply(); m.requestPinAppWidget(new ComponentName(c, ZapomniWidget.class), null, null); }
              r.put("ok", ok);
              call.resolve(r);
            }
            private android.webkit.WebView printWv;
            @PluginMethod
            public void printImage(final PluginCall call) {
              final String data = call.getString("data", "");
              final boolean land = Boolean.TRUE.equals(call.getBoolean("landscape", false));
              getActivity().runOnUiThread(new Runnable() {
                @Override
                public void run() {
                  try {
                    final boolean[] done = {false};
                    printWv = new android.webkit.WebView(getActivity());
                    printWv.setWebViewClient(new android.webkit.WebViewClient() {
                      @Override
                      public void onPageFinished(android.webkit.WebView v, String url) {
                        if (done[0]) return;
                        done[0] = true;
                        android.print.PrintManager pm = (android.print.PrintManager) getActivity().getSystemService(Context.PRINT_SERVICE);
                        android.print.PrintAttributes.MediaSize ms = land ? android.print.PrintAttributes.MediaSize.ISO_A4.asLandscape() : android.print.PrintAttributes.MediaSize.ISO_A4;
                        pm.print("week2day", v.createPrintDocumentAdapter("week2day"), new android.print.PrintAttributes.Builder().setMediaSize(ms).setMinMargins(android.print.PrintAttributes.Margins.NO_MARGINS).build());
                      }
                    });
                    printWv.loadDataWithBaseURL(null, "<html><head><style>@page{margin:0}body{margin:0}img{width:100%}</style></head><body><img src=\"data:image/png;base64," + data + "\"></body></html>", "text/html", "utf-8", null);
                    call.resolve();
                  } catch (Exception e) {
                    call.reject(String.valueOf(e.getMessage()));
                  }
                }
              });
            }
            @PluginMethod
            public void openSettings(PluginCall call) {
              Context c = getContext();
              String k = call.getString("kind", "");
              String pkg = "package:" + c.getPackageName();
              Intent i;
              if (k.equals("dnd")) i = new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS);
              else if (k.equals("admin")) {
                i = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                i.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, new ComponentName(c, AdminReceiver.class));
              }
              else if (k.equals("overlay")) i = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse(pkg));
              else if (k.equals("battery")) i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse(pkg));
              else if (k.equals("alarm") && Build.VERSION.SDK_INT >= 31) i = new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM, Uri.parse(pkg));
              else i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse(pkg));
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              try {
                c.startActivity(i);
                call.resolve();
              } catch (Exception e) {
                try {
                  Intent f = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse(pkg));
                  f.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  c.startActivity(f);
                  call.resolve();
                } catch (Exception e2) {
                  call.reject(String.valueOf(e2.getMessage()));
                }
              }
            }
          }
          EOF
          cat > android/app/src/main/java/com/zapomni/app/Scheduler.java <<'EOF'
          package com.zapomni.app;
          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.admin.DevicePolicyManager;
          import android.content.BroadcastReceiver;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Build;
          import java.util.Calendar;
          import java.util.HashMap;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class Scheduler extends BroadcastReceiver {
            static final String P = "zp";
            static final long EVERY = 15 * 60 * 1000L;

            static void save(Context c, String items, boolean notify) {
              SharedPreferences sp = c.getSharedPreferences(P, 0);
              try {
                JSONArray old = new JSONArray(sp.getString("items", "[]"));
                JSONArray nu = new JSONArray(items);
                HashMap<String, String> m = new HashMap<String, String>();
                for (int i = 0; i < nu.length(); i++) m.put(nu.getJSONObject(i).getString("id"), nu.getJSONObject(i).toString());
                for (int i = 0; i < old.length(); i++) {
                  JSONObject o = old.getJSONObject(i);
                  String id = o.getString("id");
                  if (sp.getBoolean("a_" + id, false) && !o.toString().equals(m.get(id))) {
                    try {
                      run(c, sp, o, 1);
                    } catch (Exception e) {
                    }
                    sp.edit().putBoolean("a_" + id, false).apply();
                  }
                }
              } catch (Exception e) {
              }
              sp.edit().putString("items", items).putBoolean("notify", notify).apply();
            }

            static PendingIntent pi(Context c, int code, String id, int ph) {
              Intent i = new Intent(c, Scheduler.class).putExtra("id", id).putExtra("ph", ph);
              return PendingIntent.getBroadcast(c, code, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
            }

            static boolean has(JSONArray d, int v) throws Exception {
              for (int i = 0; i < d.length(); i++) if (d.getInt(i) == v) return true;
              return false;
            }

            static int mins(String hm) {
              String[] p = hm.split(":");
              return Integer.parseInt(p[0]) * 60 + Integer.parseInt(p[1]);
            }

            static boolean inRange(JSONObject o) throws Exception {
              Calendar now = Calendar.getInstance();
              int n = now.get(Calendar.HOUR_OF_DAY) * 60 + now.get(Calendar.MINUTE);
              int f = mins(o.getString("from")), t = mins(o.getString("to"));
              JSONArray d = o.getJSONArray("days");
              int dow = now.get(Calendar.DAY_OF_WEEK);
              int prev = dow == 1 ? 7 : dow - 1;
              if (f < t) return has(d, dow) && n >= f && n < t;
              if (f > t) return (has(d, dow) && n >= f) || (has(d, prev) && n < t);
              return false;
            }

            static long next(JSONObject o, int ph) throws Exception {
              String[] hm = o.getString(ph == 0 ? "from" : "to").split(":");
              JSONArray d = o.getJSONArray("days");
              Calendar now = Calendar.getInstance();
              for (int add = 0; add <= 8; add++) {
                Calendar t = (Calendar) now.clone();
                t.add(Calendar.DAY_OF_YEAR, add);
                t.set(Calendar.HOUR_OF_DAY, Integer.parseInt(hm[0]));
                t.set(Calendar.MINUTE, Integer.parseInt(hm[1]));
                t.set(Calendar.SECOND, 0);
                t.set(Calendar.MILLISECOND, 0);
                if (t.getTimeInMillis() <= now.getTimeInMillis() + 1000) continue;
                if (ph == 1 || has(d, t.get(Calendar.DAY_OF_WEEK))) return t.getTimeInMillis();
              }
              return now.getTimeInMillis() + 86400000L;
            }

            static void set(AlarmManager am, long t, PendingIntent p) {
              try {
                if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms()) am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, p);
                else am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, p);
              } catch (Exception e) {
                am.set(AlarmManager.RTC_WAKEUP, t, p);
              }
            }

            static void scheduleAll(Context c) {
              SharedPreferences sp = c.getSharedPreferences(P, 0);
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              for (String k : sp.getString("ids", "").split(",")) {
                if (!k.isEmpty()) am.cancel(pi(c, Integer.parseInt(k), "", 0));
              }
              StringBuilder ids = new StringBuilder();
              try {
                JSONArray a = new JSONArray(sp.getString("items", "[]"));
                for (int n = 0; n < a.length(); n++) {
                  JSONObject o = a.getJSONObject(n);
                  for (int ph = 0; ph < 2; ph++) {
                    int code = (o.getString("id") + ph).hashCode();
                    set(am, next(o, ph), pi(c, code, o.getString("id"), ph));
                    ids.append(code).append(',');
                  }
                }
              } catch (Exception e) {
              }
              sp.edit().putString("ids", ids.toString()).apply();
              try {
                am.setInexactRepeating(AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + EVERY, EVERY, pi(c, 7771, "", 2));
              } catch (Exception e) {
              }
              reconcile(c);
              ZapomniWidget.updateAll(c);
            }

            static void reconcile(Context c) {
              SharedPreferences sp = c.getSharedPreferences(P, 0);
              try {
                JSONArray a = new JSONArray(sp.getString("items", "[]"));
                for (int n = 0; n < a.length(); n++) {
                  JSONObject o = a.getJSONObject(n);
                  String t = o.getString("type");
                  if (!t.equals("dnd") && !t.equals("silent")) continue;
                  boolean act = sp.getBoolean("a_" + o.getString("id"), false);
                  boolean in = inRange(o);
                  try {
                    if (in && !act) run(c, sp, o, 0);
                    else if (!in && act) run(c, sp, o, 1);
                  } catch (Exception e) {
                  }
                }
              } catch (Exception e) {
              }
            }

            @Override
            public void onReceive(Context c, Intent in) {
              if (in.getAction() != null) {
                scheduleAll(c);
                return;
              }
              int ph = in.getIntExtra("ph", 0);
              if (ph == 2) {
                reconcile(c);
                ZapomniWidget.updateAll(c);
                return;
              }
              SharedPreferences sp = c.getSharedPreferences(P, 0);
              String id = in.getStringExtra("id");
              try {
                JSONArray a = new JSONArray(sp.getString("items", "[]"));
                for (int n = 0; n < a.length(); n++) {
                  JSONObject o = a.getJSONObject(n);
                  if (o.getString("id").equals(id)) run(c, sp, o, ph);
                }
              } catch (Exception e) {
              }
              scheduleAll(c);
            }

            static boolean others(SharedPreferences sp, String id, String type) {
              try {
                JSONArray a = new JSONArray(sp.getString("items", "[]"));
                for (int n = 0; n < a.length(); n++) {
                  JSONObject o = a.getJSONObject(n);
                  if (!o.getString("id").equals(id) && o.getString("type").equals(type) && sp.getBoolean("a_" + o.getString("id"), false)) return true;
                }
              } catch (Exception e) {
              }
              return false;
            }

            static void run(Context c, SharedPreferences sp, JSONObject o, int ph) throws Exception {
              String t = o.getString("type"), id = o.getString("id"), v = o.optString("value", "");
              String title = o.optString("title", "week2day"), text = o.optString("text", "");
              boolean on = ph == 0, nt = sp.getBoolean("notify", true);
              boolean act = sp.getBoolean("a_" + id, false);
              NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
              AudioManager au = (AudioManager) c.getSystemService(Context.AUDIO_SERVICE);
              SharedPreferences.Editor ed = sp.edit();
              try {
                if (t.equals("dnd")) {
                  if (on && nm.isNotificationPolicyAccessGranted()) {
                    nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE);
                    ed.putBoolean("a_" + id, true);
                    if (nt) note(c, title, text, null);
                  } else if (!on && act) {
                    if (!others(sp, id, t)) nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                    ed.putBoolean("a_" + id, false);
                  }
                } else if (t.equals("silent")) {
                  if (on) {
                    if (!others(sp, id, t)) sp.edit().putInt("r0", au.getRingerMode()).apply();
                    ed.putBoolean("a_" + id, true);
                    try {
                      au.setRingerMode(AudioManager.RINGER_MODE_SILENT);
                    } catch (Exception e) {
                      au.setRingerMode(AudioManager.RINGER_MODE_VIBRATE);
                    }
                    if (nt) note(c, title, text, null);
                  } else if (act) {
                    if (!others(sp, id, t)) {
                      try {
                        au.setRingerMode(sp.getInt("r0", AudioManager.RINGER_MODE_NORMAL));
                      } catch (Exception e) {
                      }
                    }
                    ed.putBoolean("a_" + id, false);
                  }
                } else if (on && t.equals("link")) {
                  open(c, new Intent(Intent.ACTION_VIEW, Uri.parse(v.startsWith("http") ? v : "https://" + v)), title, text);
                } else if (on && t.equals("app")) {
                  PackageManager pm = c.getPackageManager();
                  Intent li = pm.getLaunchIntentForPackage(v);
                  if (li == null) {
                    Intent m = new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER);
                    for (ResolveInfo r : pm.queryIntentActivities(m, 0)) {
                      if (r.loadLabel(pm).toString().toLowerCase().contains(v.toLowerCase())) {
                        li = pm.getLaunchIntentForPackage(r.activityInfo.packageName);
                        break;
                      }
                    }
                  }
                  if (li != null) open(c, li, title, text);
                } else if (on && t.equals("lock")) {
                  DevicePolicyManager d = (DevicePolicyManager) c.getSystemService(Context.DEVICE_POLICY_SERVICE);
                  if (d.isAdminActive(new ComponentName(c, AdminReceiver.class))) d.lockNow();
                  if (nt) note(c, title, text, null);
                }
              } finally {
                ed.apply();
              }
            }

            static void open(Context c, Intent i, String title, String text) {
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              try {
                c.startActivity(i);
              } catch (Exception e) {
              }
              note(c, title, text, PendingIntent.getActivity(c, title.hashCode(), i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
            }

            static void note(Context c, String title, String text, PendingIntent p) {
              NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
              Notification.Builder b;
              if (Build.VERSION.SDK_INT >= 26) {
                nm.createNotificationChannel(new NotificationChannel("zp", "week2day", NotificationManager.IMPORTANCE_HIGH));
                b = new Notification.Builder(c, "zp");
              } else b = new Notification.Builder(c);
              b.setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle(title).setContentText(text).setAutoCancel(true);
              if (p != null) b.setContentIntent(p);
              nm.notify((title + text).hashCode(), b.build());
            }
          }
          EOF
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/xml android/app/src/main/res/layout android/app/src/main/res/drawable android/app/src/main/res/values
          cat > android/app/src/main/java/com/zapomni/app/ZapomniWidget.java <<'EOF'
          package com.zapomni.app;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.widget.RemoteViews;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Collections;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class ZapomniWidget extends AppWidgetProvider {
            @Override
            public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
              for (int id : ids) m.updateAppWidget(id, build(c, id));
            }

            @Override
            public void onDeleted(Context c, int[] ids) {
              SharedPreferences.Editor e = c.getSharedPreferences(Scheduler.P, 0).edit();
              for (int id : ids) e.remove("zw_" + id);
              e.apply();
            }

            static void updateAll(Context c) {
              AppWidgetManager m = AppWidgetManager.getInstance(c);
              for (int id : m.getAppWidgetIds(new ComponentName(c, ZapomniWidget.class))) m.updateAppWidget(id, build(c, id));
            }

            static String takePending(SharedPreferences sp) {
              String g = sp.getString("pending", null);
              long t = sp.getLong("pending_t", 0);
              sp.edit().remove("pending").remove("pending_t").apply();
              return (g != null && System.currentTimeMillis() - t < 120000) ? g : null;
            }

            static RemoteViews build(Context c, int id) {
              RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget);
              SharedPreferences sp = c.getSharedPreferences(Scheduler.P, 0);
              if (!sp.contains("zw_" + id)) {
                String p = takePending(sp);
                if (p != null) sp.edit().putString("zw_" + id, p).apply();
              }
              String gid = sp.getString("zw_" + id, "");
              int dow = Calendar.getInstance().get(Calendar.DAY_OF_WEEK);
              ArrayList<String> rows = new ArrayList<String>();
              String title = c.getString(R.string.w_title);
              try {
                JSONArray gs = new JSONArray(sp.getString("wg", "[]"));
                for (int i = 0; i < gs.length(); i++) {
                  JSONObject g = gs.getJSONObject(i);
                  if (!gid.isEmpty() && !g.getString("id").equals(gid)) continue;
                  if (!gid.isEmpty()) title = g.getString("name");
                  JSONArray r = g.getJSONArray("rows");
                  for (int j = 0; j < r.length(); j++) {
                    JSONObject o = r.getJSONObject(j);
                    if (!Scheduler.has(o.getJSONArray("days"), dow)) continue;
                    String acts = o.optString("acts", "");
                    rows.add(o.getString("from") + " - " + o.getString("to") + "  " + o.optString("name") + (acts.isEmpty() ? "" : "\n     " + acts));
                  }
                }
              } catch (Exception e) {
              }
              Collections.sort(rows);
              StringBuilder sb = new StringBuilder();
              for (String r : rows) sb.append(r).append("\n");
              v.setTextViewText(R.id.wtitle, title);
              v.setTextViewText(R.id.wbody, rows.isEmpty() ? c.getString(R.string.w_empty) : sb.toString().trim());
              Intent li = c.getPackageManager().getLaunchIntentForPackage(c.getPackageName());
              if (li != null) v.setOnClickPendingIntent(R.id.wroot, PendingIntent.getActivity(c, 0, li, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
              return v;
            }
          }
          EOF
          cat > android/app/src/main/java/com/zapomni/app/WidgetConfig.java <<'EOF'
          package com.zapomni.app;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.appwidget.AppWidgetManager;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import java.util.ArrayList;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class WidgetConfig extends Activity {
            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              final int wid = getIntent().getIntExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, 0);
              final Intent res = new Intent().putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, wid);
              setResult(RESULT_CANCELED, res);
              SharedPreferences sp = getSharedPreferences(Scheduler.P, 0);
              String pend = ZapomniWidget.takePending(sp);
              if (pend != null) {
                done(pend, wid, res);
                return;
              }
              final ArrayList<String> ids = new ArrayList<String>();
              ArrayList<String> names = new ArrayList<String>();
              ids.add("");
              names.add(getString(R.string.w_all));
              try {
                JSONArray a = new JSONArray(sp.getString("wg", "[]"));
                for (int i = 0; i < a.length(); i++) {
                  JSONObject o = a.getJSONObject(i);
                  ids.add(o.getString("id"));
                  names.add(o.getString("name"));
                }
              } catch (Exception e) {
              }
              new AlertDialog.Builder(this)
                  .setTitle(R.string.w_pick)
                  .setItems(names.toArray(new String[0]), (d, i) -> done(ids.get(i), wid, res))
                  .setOnCancelListener(d -> finish())
                  .show();
            }

            void done(String gid, int wid, Intent res) {
              getSharedPreferences(Scheduler.P, 0).edit().putString("zw_" + wid, gid).apply();
              AppWidgetManager.getInstance(this).updateAppWidget(wid, ZapomniWidget.build(this, wid));
              setResult(RESULT_OK, res);
              finish();
            }
          }
